name = "cloudflare-photo"
compatibility_date = "2026-03-09"
pages_build_output_dir = "public"

[vars]
SITE_TITLE = "Photograph"
SESSION_COOKIE_NAME = "cf_photo_session"
SESSION_MAX_AGE_SECONDS = "1209600"

[[d1_databases]]
binding = "DB"
database_name = "photo-db"
database_id = "replace-with-your-d1-id"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "replace-with-your-kv-id"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "photo-originals"
